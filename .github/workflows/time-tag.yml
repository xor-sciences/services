name: Automatic monthly tag with format v0.0.yyMM00
on:
  schedule:
    # At 00:00 on the first day of each month
    - cron: '0 0 1 * *'
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0
      - name: Generate a new tag and push it
        run: |
          TAG="v0.0.$(date +%y%m)00"
          git tag $TAG
          git push origin $TAG
